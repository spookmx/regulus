name: ✨ Feature Request
description: Propose a new feature, agent capability, or compliance workflow.
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Submit a feature proposal or enhancement request for Regulus.
  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What domain does this feature belong to?
      options:
        - Regulatory Artifact Schemas (LRD, BRD, PRD, DEC, etc.)
        - Antigravity AI Agent Capability
        - Graph Traceability / Provenance Engine
        - Frontend UI & Compliance Dashboard
        - Integration / Sync (e.g. Jira, Airtable, Firebase)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see added.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
